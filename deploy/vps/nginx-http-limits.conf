# Install under an nginx path included from the top-level `http` context.
# Carrier and enrollment zones are deliberately independent. A mailbox flood
# must not consume the carrier's connection or upgrade buckets.
#
# Per-peer zones use the original TCP peer saved by ngx_http_realip_module.
# Unlike $remote_addr and $binary_remote_addr, this value is not replaced from
# X-Forwarded-For, X-Real-IP, or another configured RealIP request header. The
# textual key costs a little more shared memory but keeps an ambient RealIP
# policy from turning a request header into a rate-limit identity.
#
# These zone names deliberately differ from the earlier `*_per_ip` names.
# nginx refuses to reuse a live shared-memory zone under a different key, so a
# new name is required for a safe graceful reload from that configuration.
limit_conn_zone $realip_remote_addr zone=owntransit_conn_per_peer:1m;
limit_conn_zone $server_name zone=owntransit_conn_global:1m;
limit_req_zone $realip_remote_addr zone=owntransit_upgrade_per_peer:1m rate=1r/s;
limit_req_zone $server_name zone=owntransit_upgrade_global:1m rate=4r/s;

limit_conn_zone $realip_remote_addr zone=owntransit_enrollment_conn_per_peer:1m;
limit_conn_zone $server_name zone=owntransit_enrollment_conn_global:1m;
limit_req_zone $realip_remote_addr zone=owntransit_enrollment_upgrade_per_peer:1m rate=2r/s;
limit_req_zone $server_name zone=owntransit_enrollment_upgrade_global:1m rate=8r/s;
