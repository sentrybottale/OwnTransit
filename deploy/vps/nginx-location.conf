# Example exact-match addition to an operator-selected TLS server block.
# Unrelated locations remain unchanged.
# Port 9087 must stay host-loopback-only. This clear WebSocket hop carries a
# legacy v1 outer-mTLS byte stream for OwnTransit; the relay terminates
# that TLS, not nginx.
# Host and forwarding headers are never authentication or authorization input.
# The named zones are defined by nginx-http-limits.conf in the top-level http
# context. Per-peer zones key on the original TCP peer retained in
# `$realip_remote_addr`, not the RealIP-rewritten `$remote_addr` or
# `$binary_remote_addr`; global zones key on the selected virtual server.
# Request-carried forwarding headers therefore cannot select a quota key even
# when unrelated host configuration enables RealIP processing.
location = /connects {
  access_log off;
  limit_conn owntransit_conn_per_peer 8;
  limit_conn owntransit_conn_global 96;
  limit_conn_status 429;
  limit_req zone=owntransit_upgrade_per_peer burst=4 nodelay;
  limit_req zone=owntransit_upgrade_global burst=8 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:9087/connects;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  # Empty Origin remains absent; a browser-supplied Origin is forwarded so
  # the relay rejects it before the WebSocket upgrade.
  proxy_set_header Origin $http_origin;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_set_header Sec-WebSocket-Extensions "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Real-IP "";
  proxy_set_header X-Forwarded-Proto "";
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_connect_timeout 5s;
  proxy_send_timeout 1d;
  proxy_read_timeout 1d;
}

# Enrollment is a distinct short-lived opaque WebSocket action, not a carrier
# session and not an HTTP upload API. Its independent quotas cannot consume the
# SSH carrier's buckets. The relay accepts one bounded binary request and one
# bounded binary response, then closes the socket.
location = /connects/enrollment {
  access_log off;
  limit_conn owntransit_enrollment_conn_per_peer 4;
  limit_conn owntransit_enrollment_conn_global 16;
  limit_conn_status 429;
  limit_req zone=owntransit_enrollment_upgrade_per_peer burst=4 nodelay;
  limit_req zone=owntransit_enrollment_upgrade_global burst=16 nodelay;
  limit_req_status 429;
  client_max_body_size 1k;
  client_body_timeout 5s;
  proxy_pass http://127.0.0.1:9087/connects/enrollment;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
  # Forward Origin so the relay rejects browser-originated requests. Disable
  # extension negotiation rather than allowing compressed WebSocket frames.
  proxy_set_header Origin $http_origin;
  proxy_set_header Sec-WebSocket-Extensions "";
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Real-IP "";
  proxy_set_header X-Forwarded-Proto "";
  # WebSocket data is carried only after upgrade. Never proxy an HTTP request
  # body or its framing headers into the loopback exchange handler.
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Transfer-Encoding "";
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_next_upstream off;
  proxy_connect_timeout 5s;
  proxy_send_timeout 15s;
  proxy_read_timeout 15s;
}
